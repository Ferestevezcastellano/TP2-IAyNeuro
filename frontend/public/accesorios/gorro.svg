<!-- Gorro rojo. Mismo lienzo de 150x150 que las mascotas y ya ubicado sobre la
     cabeza, así superponerlo es apilar dos <img> del mismo tamaño. -->
<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- visera -->
  <path d="M31 34c0 6 5 10 12 10h70c7 0 12-4 12-10 0-3-2-5-6-5H37c-4 0-6 2-6 5z" fill="#E0453A"/>
  <!-- copa -->
  <path d="M40 31c0-19 16-27 35-27s35 8 35 27c0 2-1 3-3 3H43c-2 0-3-1-3-3z" fill="#F26A5E"/>
  <!-- gajo de sombra, para que no sea un bloque plano -->
  <path d="M75 4c19 0 35 8 35 27 0 2-1 3-3 3H88c3-13-1-24-13-30z" fill="#E0453A"/>
  <!-- pompón -->
  <circle cx="75" cy="6" r="7" fill="#FCD53F"/>
</svg>
