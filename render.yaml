# Backend de AMI en Render (plan gratis). Render lo lee al crear un "Blueprint"
# desde este repositorio: no hay que cargar nada a mano.
#
# El plan gratis apaga el servidor tras 15 minutos sin uso y, como el estado
# vive en memoria, al volver a prenderse los alumnos arrancan de cero. El
# contenido de los niveles se carga solo en cada arranque.
services:
  - type: web
    name: ami-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && bash scripts/bajar-modelo-vosk.sh
    startCommand: npm run start:prod
    healthCheckPath: /catalog/levels
    envVars:
      - key: NODE_VERSION
        value: 22
      # En el teléfono la voz la reconoce Chrome. En Linux o Firefox el navegador
      # no puede, y la app manda el audio grabado: lo reconoce Vosk acá. Con el
      # modelo cargado el proceso usa unos 230 MB, dentro de los 512 del plan.
      - key: AMI_SPEECH_PROVIDER
        value: vosk
      - key: AMI_VOSK_MODEL_PATH
        value: ./models/vosk-model-small-es-0.42
